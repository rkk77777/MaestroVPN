<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maestro VPN — Личный кабинет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f6fc;
      --muted: #8b98b4;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .status-active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin: 14px 0 10px;
      color: #dbeafe;
    }
    .config-card {
      background: #0f1523;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .config-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .country-name { font-weight: 600; font-size: 15px; }
    .proto-tag {
      font-size: 11px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      transition: opacity 0.15s ease;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .btn-copy {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .loader { text-align: center; padding: 24px 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Maestro VPN</div>
    <div class="badge" id="userBadge">ID: —</div>
  </div>

  <div class="card">
    <div class="status-row">
      <span style="font-weight:600;">Статус подписки</span>
      <span class="status-pill status-inactive" id="subPill">Проверка...</span>
    </div>
    <div class="muted" id="subDetails">Загружаем данные из Supabase...</div>
  </div>

  <div class="section-title">🔑 Ваши конфиги</div>
  <div id="configsContainer">
    <div class="loader">Подключение к Supabase...</div>
  </div>

  <div class="card" style="margin-top: 16px;">
    <div style="font-weight:600; font-size:14px; margin-bottom:6px;">📲 Как подключиться за 10 секунд</div>
    <div class="muted">
      1. Нажмите <b>«Скопировать»</b> на нужном сервере.<br/>
      2. Откройте ваше VPN-приложение и вставьте ссылку из буфера обмена.
    </div>
  </div>

  <div class="toast" id="toast">Скопировано в буфер обмена</div>

  <script>
    const SUPABASE_URL = "https://eccfkiuynfuaawilsulu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kkLntX7_Yl9KBIUiv0PJ0w_muQbKj4X";
    const CONFIGS_TABLE = "vpn_configs_maestro";
    const GERMANY_URI = "https://s-25202.de8.h1clayd.click/sub/131437e3-1547-4bad-9020-5c3e850fbb08#Maestro%20VPN%20%E2%80%A2%20%D0%93%D0%B5%D1%80%D0%BC%D0%B0%D0%BD%D0%B8%D1%8F";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = tg?.initDataUnsafe?.user;
    const userId = tgUser?.id || Number(urlParams.get("uid")) || null;

    document.getElementById("userBadge").textContent = userId ? `ID: ${userId}` : "Гость";

    function buildGermanyUri(rawUri) {
      const cleaned = String(rawUri || "").trim();
      const baseUri = cleaned.includes("#") ? cleaned.slice(0, cleaned.indexOf("#")) : cleaned;
      const targetBase = baseUri || GERMANY_URI.split("#")[0];
      return `${targetBase}#${encodeURIComponent("Maestro VPN • Германия")}`;
    }

    function isRealGermanyConfig(cfg) {
      const uri = String(cfg?.config_uri || "").trim();
      const country = String(cfg?.country_name || "").toLowerCase();
      const isPlaceholderOrMock =
        !uri ||
        uri.includes("example.com") ||
        uri.includes("placeholder") ||
        uri.includes("test") ||
        uri.includes("demo") ||
        uri.includes("fake") ||
        uri.includes("0.0.0.0") ||
        uri.includes("127.0.0.1");

      if (isPlaceholderOrMock) return false;
      return uri.includes("h1clayd.click") || uri.includes("de8") || country.includes("германия") || country.includes("germany");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("✅ Ссылка скопирована в буфер обмена");
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("✅ Ссылка скопирована в буфер обмена");
      }
    }

    function formatDateMsk(isoStr) {
      if (!isoStr) return "—";
      const d = new Date(isoStr);
      return d.toLocaleString("ru-RU", {
        timeZone: "Europe/Moscow",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }) + " МСК";
    }

    async function loadDashboard() {
      const subPill = document.getElementById("subPill");
      const subDetails = document.getElementById("subDetails");
      const container = document.getElementById("configsContainer");

      if (!userId) {
        subPill.textContent = "Не авторизован";
        subDetails.textContent = "Откройте Mini App через кнопку внутри Telegram-бота Maestro VPN.";
        container.innerHTML = `<div class="card muted">Не удалось определить ваш Telegram ID.</div>`;
        return;
      }

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data: sub, error: subErr } = await supabaseClient
        .from("vpn_subscriptions")
        .select("*")
        .eq("user_id", userId)
        .maybeSingle();

      if (subErr) {
        subPill.textContent = "Ошибка БД";
        subDetails.textContent = "Ошибка запроса к Supabase: " + subErr.message;
        container.innerHTML = "";
        return;
      }

      const now = new Date();
      const expiresAt = sub?.expires_at ? new Date(sub.expires_at) : null;
      const isActive = Boolean(sub?.is_active && expiresAt && expiresAt > now);

      if (!isActive) {
        subPill.className = "status-pill status-inactive";
        subPill.textContent = "Не активна";
        subDetails.textContent = "Оформите или продлите подписку в боте, чтобы получить доступ к конфигам.";
        container.innerHTML = `
          <div class="card">
            <div style="font-weight:600; margin-bottom:6px;">🔒 Доступ к ключам закрыт</div>
            <div class="muted" style="margin-bottom:12px;">У вас нет активной подписки. Вернитесь в бот и выберите подходящий тариф.</div>
            <button class="btn btn-primary" onclick="tg?.close()">Вернуться в бот для покупки</button>
          </div>
        `;
        return;
      }

      subPill.className = "status-pill status-active";
      subPill.textContent = "Активна";
      subDetails.innerHTML = `Действует до: <b>${formatDateMsk(sub.expires_at)}</b> • Лимит устройств: <b>${sub.devices_limit}</b>`;

      const { data: configs, error: cfgErr } = await supabaseClient
        .from(CONFIGS_TABLE)
        .select("*")
        .eq("is_active", true)
        .eq("is_shared", true)
        .order("id", { ascending: false });

      if (cfgErr) {
        container.innerHTML = `<div class="card muted">Ошибка загрузки конфигов: ${cfgErr.message}</div>`;
        return;
      }

      const validGermanyRows = Array.isArray(configs)
        ? configs.filter(isRealGermanyConfig)
        : [];

      const activeRow = validGermanyRows[0] || {
        country_name: "🇩🇪 Германия",
        config_uri: GERMANY_URI,
        protocol: "VLESS"
      };

      const uri = buildGermanyUri(activeRow.config_uri);

      container.innerHTML = "";
      const card = document.createElement("div");
      card.className = "config-card";
      card.innerHTML = `
        <div class="config-top">
          <span class="country-name">🇩🇪 Maestro VPN • Германия</span>
          <span class="proto-tag">${activeRow.protocol || "VLESS"}</span>
        </div>
        <button class="btn btn-copy" id="copyConfigBtn">📋 Скопировать</button>
      `;

      card.querySelector("#copyConfigBtn").addEventListener("click", () => {
        copyText(uri);
      });

      container.appendChild(card);
    }

    loadDashboard();
  </script>
</body>
</html>
